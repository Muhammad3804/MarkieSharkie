  /admin/image-detection:
    get:
      tags: [Admin]
      operationId: adminImageDetectionStatus
      summary: Which AI image check is running (REQ-9)
      description: |
        `provider` is `sightengine` (live, needs SIGHTENGINE_API_USER / SIGHTENGINE_API_SECRET) or `fake` (every photo
        genuine, used without keys), with the timeout and score thresholds.
      x-srs: [REQ-9]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The detector in use.
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider: { type: string, enum: [sightengine, fake, custom] }
                  live: { type: boolean }
                  timeoutMs: { type: integer }
                  flagThreshold: { type: number }
                  genuineThreshold: { type: number }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrSuspended' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/image-detection/test:
    post:
      tags: [Admin]
      operationId: adminImageDetectionTest
      summary: Test the AI image check with one photo (REQ-9 demo)
      description: |
        Runs the photo (JPEG / PNG up to 5 MB, checked by content) through the same detector and the same genuine /
        flagged rule as real uploads. Nothing is stored except an audit row (`image.detection_test`, with the score
        and verdict). 502 `DETECTOR_UNAVAILABLE` when the provider doesn't answer. Rate limited: 30 an hour per IP.
      x-srs: [REQ-9, NFR-2, NFR-4]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: The detector's answer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider: { type: string }
                  live: { type: boolean }
                  score: { type: number, minimum: 0, maximum: 1, description: Probability the photo is AI-generated. }
                  verdict: { type: string, enum: [genuine, flagged] }
                  highConfidence: { type: boolean }
                  thresholds: { type: object, properties: { genuine: { type: number }, flag: { type: number } } }
                  durationMs: { type: integer }
                  checkedAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrSuspended' }
        '413': { $ref: '#/components/responses/FileRejected' }
        '415': { $ref: '#/components/responses/FileRejected' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502':
          description: '`DETECTOR_UNAVAILABLE`: the AI provider did not answer (timeout, bad keys, quota).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from login or refresh. HS256, 15 minutes, claims `sub` (user id), `role`, `iss`, `aud`.
    refreshCookie:
      type: apiKey
      in: cookie
      name: ms_refresh
      description: httpOnly, SameSite=Strict, Path=/api/auth, Secure in production. Set by login and refresh.

  headers:
    SetRefreshCookie:
      description: '`ms_refresh=<token>; Path=/api/auth; Expires=<session expiry>; HttpOnly; SameSite=Strict` (+ `Secure` in production).'
      schema: { type: string }
    ClearRefreshCookie:
      description: '`ms_refresh=; Path=/api/auth; Expires=Thu, 01 Jan 1970 00:00:00 GMT; HttpOnly; SameSite=Strict`.'
      schema: { type: string }

  parameters:
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    NotFound:
      description: '`NOT_FOUND`: unknown, not yours, or not public (the answer never says which).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidStatus:
      description: '`INVALID_STATUS`: the listing or photo is not in a state that allows this (e.g. approving a rejected listing).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    FileRejected:
      description: '`FILE_TOO_LARGE` (413) or `UNSUPPORTED_FILE_TYPE` (415): the message says which types and sizes are allowed.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ResetCodeRejected:
      description: |
        `VALIDATION_ERROR` (bad email / code format / weak password), `RESET_CODE_INVALID` (wrong code; unknown email
        too, so it can't be told apart; `details.attemptsLeft` when a code exists) or `RESET_CODE_EXPIRED` (expired,
        already used, or replaced by a newer code).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            {
              error:
                {
                  code: RESET_CODE_INVALID,
                  message: That code isn’t right. 4 tries left.,
                  details: { attemptsLeft: 4 },
                },
            }
    ResetCodeLocked:
      description: '`RESET_CODE_LOCKED`: 5 wrong codes. The code is spent; ask for a new one.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            { error: { code: RESET_CODE_LOCKED, message: Too many wrong codes. Ask for a new code to try again. } }
    ValidationError:
      description: '`VALIDATION_ERROR`: one or more fields are invalid or not allowed. Nothing was saved.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationErrorResponse' }
          example:
            error:
              code: VALIDATION_ERROR
              message: Some fields need fixing. Check the highlighted fields and try again.
              details:
                - { field: phone, message: Enter a Pakistani mobile number like 0300-1234567 }
                - { field: password, message: Include at least one digit. }
    Unauthenticated:
      description: '`UNAUTHENTICATED`: missing, invalid or expired access token, or the account no longer exists. Refresh, then retry.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: UNAUTHENTICATED, message: Your session has ended. Log in again to continue. } }
    AccountSuspended:
      description: '`ACCOUNT_SUSPENDED`: an administrator suspended this account (EUC-02 4.2, REQ-3).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              {
                code: ACCOUNT_SUSPENDED,
                message: Your account has been suspended by an administrator. Contact support.,
              }
    ForbiddenOrSuspended:
      description: '`FORBIDDEN` (this role cannot use the route, REQ-3 / SYS-04) or `ACCOUNT_SUSPENDED`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            forbidden: { value: { error: { code: FORBIDDEN, message: "Your account type can't use this feature." } } }
            suspended:
              value:
                error:
                  {
                    code: ACCOUNT_SUSPENDED,
                    message: Your account has been suspended by an administrator. Contact support.,
                  }
    RateLimited:
      description: '`RATE_LIMITED`: too many requests from this IP. `RateLimit` / `RateLimit-Policy` headers say when to retry.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            {
              error:
                { code: RATE_LIMITED, message: Too many attempts from this device. Wait a few minutes and try again. },
            }
    PayloadTooLarge:
      description: '`PAYLOAD_TOO_LARGE`: JSON bodies are limited to 1 MB. Malformed JSON gives 400 `INVALID_JSON`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: '`INTERNAL_ERROR`: an unexpected server error. No internal details are included.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            {
              error: { code: INTERNAL_ERROR, message: Something went wrong on our side. Please try again in a moment. },
            }

  schemas:
    VenueCard:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        area: { type: string }
        city: { type: string }
        highlights: { type: string }
        availableDates: { type: string }
        rating: { type: number }
        reviewCount: { type: integer }
        priceFrom: { $ref: '#/components/schemas/Money' }
        priceUnit: { type: string, const: per_person }
        googleMapsUrl:
          {
            type: [string, 'null'],
            description: 'Link to the venue on Google Maps (https, Google hosts only), or null.',
          }
        image: { type: string, format: uri }
        lat: { type: [number, 'null'] }
        lng: { type: [number, 'null'] }
        capacity: { type: integer }
        venueType: { type: string }
    LandingSection:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        venues: { type: array, items: { $ref: '#/components/schemas/VenueCard' } }
    VenueSearchResult:
      type: object
      properties:
        venues: { type: array, items: { $ref: '#/components/schemas/VenueCard' } }
        total: { type: integer }
        page: { type: integer }
        pageCount: { type: integer }
        pageSize: { type: integer }
        priceRange: { type: object, properties: { min: { type: integer }, max: { type: integer } } }
        sectionTitle: { type: string }
    VenueDetail:
      type: object
      description: |
        The card fields plus tagline, address, lat/lng, venueType, supportedEvents, capacity, facilities, description,
        images, heroImages, gallery (per hall, by section), halls (size, floor plan, zones, walkthrough), menuPackages
        (with items), addOns, bookingTerms, bridalSuite, reviews, ratingCounts, bookedDates, host, parkingSpaces,
        eventNotes. Same shape as the client's venue page expects. Each hall's walkthrough is
        { mode: generate|upload|link|skip, url, file } where file is { url, assetType: model_3d|panorama_360 } for an
        uploaded .glb / 360° JPEG (REQ-11) and null otherwise. googleMapsUrl is the owner's Google Maps link or null
        (srs-alignment #37: shown as "Read reviews on Google", no Google data is fetched).
      additionalProperties: true
    Availability:
      type: object
      properties:
        venueId: { type: string, format: uuid }
        from: { type: string, format: date }
        to: { type: string, format: date }
        halls:
          type: array
          items:
            type: object
            properties:
              hallId: { type: string, format: uuid }
              slots:
                type: array
                items:
                  type: object
                  properties:
                    slotId: { type: string, format: uuid }
                    date: { type: string, format: date }
                    startTime: { type: string }
                    endTime: { type: string }
                    slotType: { type: string, enum: [lunch, dinner] }
                    status: { type: string, enum: [available, held, booked, blocked] }
    Upload:
      type: object
      properties:
        uploadId: { type: string, format: uuid }
        kind: { type: string, enum: [photo, floor_plan, walkthrough] }
        url: { type: string, format: uri }
        mimeType: { type: string }
        size: { type: integer }
    ListingSubmission:
      type: object
      description: |
        Mirrors the wizard draft (client/src/features/host/draft.js): venue, halls (+ floorPlanUploadId, walkthrough),
        bridalSuite, venueImages ({ uploadId, hallId, category, isCover }, 5 to 60), menuPackages (sections with dishes),
        customMenu, addOns, bookingRules (days, lunch / dinner slots, advance %, cancellation policy + custom tiers).
        Numbers are sent as text like the form fields. capacity, base price and venue type are computed by the server.
      required: [venue, halls, venueImages, menuPackages, bookingRules]
      additionalProperties: true
    InvitationBody:
      type: object
      required: [template, title, eventType, hostNames]
      properties:
        template: { type: string, enum: [classic, floral, modern, mehndi] }
        title: { type: string, maxLength: 80 }
        eventType: { $ref: '#/components/schemas/EventType' }
        hostNames: { type: string, maxLength: 120 }
        message: { type: string, maxLength: 300 }
        dressCode: { type: string, maxLength: 100 }
        notes: { type: string, maxLength: 1000 }
        contactPhone: { type: [string, 'null'] }
        rsvpBy: { type: [string, 'null'], format: date }
    Invitation:
      type: object
      additionalProperties: true
    BookingRequest:
      type: object
      required: [slotId, eventType, guestCount, eventName, hostName, hostPhone]
      properties:
        slotId: { type: string, format: uuid }
        eventType: { $ref: '#/components/schemas/EventType' }
        guestCount: { type: integer }
        menuPackageId: { type: [string, 'null'], format: uuid }
        addOns:
          {
            type: array,
            items:
              {
                type: object,
                properties:
                  { addOnId: { type: string, format: uuid }, quantity: { type: integer, minimum: 0, maximum: 4 } },
              },
          }
        eventName: { type: string, maxLength: 80 }
        hostName: { type: string, maxLength: 60 }
        hostPhone: { $ref: '#/components/schemas/PkMobileInput' }
        specialRequests: { type: string, maxLength: 500 }
    Booking:
      type: object
      description: |
        bookingId, venue / hall / date / slotType / times, status (requested, held, confirmed, completed, cancelled) and
        closedAs (cancelled, rejected, expired) when cancelled, event details, guestCount and billableGuests, the price
        snapshot (menuPricePerHead, hallCharge, addOns with unitPrice, totalAmount, advancePercent, advanceDue), the
        policy snapshot, cancellationReason, refundPercent / refundAmount, events (history) on the detail, and the
        customer's contact for the venue owner. Money is a decimal string.
      additionalProperties: true
    ReviewDecision:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 5, maxLength: 500 }
    ListingEdit:
      type: object
      description: |
        The ListingSubmission shape, plus references to what is already on the server: venueImages items carry either
        imageId (kept photo) or uploadId (new); halls carry their hallId (a new hall uses any client id),
        keepFloorPlan, and walkthrough { mode: upload, keep: true } or { mode: upload, uploadId }; menuPackages carry
        menuId and addOns addOnId when they already exist.
      required: [venue, halls, venueImages, menuPackages, bookingRules]
      additionalProperties: true
    EditResult:
      type: object
      properties:
        venueId: { type: string, format: uuid }
        applied: { type: array, items: { type: string }, description: What went live now. }
        needsApproval: { type: array, items: { type: string }, description: Changed fields waiting for the admin. }
        revision: { type: [object, 'null'] }
        revisionAction: { type: string, enum: [none, created, replaced, withdrawn] }
    Revision:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, approved, rejected, withdrawn] }
        submittedAt: { type: string, format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
        note: { type: [string, 'null'] }
        changes:
          type: array
          items:
            type: object
            properties:
              section: { type: string }
              label: { type: string }
              before: { type: string }
              after: { type: string }
              afterUrl: { type: string }
      additionalProperties: true
    MenuBody:
      type: object
      required: [name, pricePerHead, minGuests, sections]
      properties:
        name: { type: string }
        description: '{ type: string }'
        pricePerHead: { type: string, description: 'Rupees as text, e.g. "2500" or "2500.50".' }
        minGuests: { type: string }
        isCustomizable: { type: boolean }
        sections:
          type: array
          items:
            {
              type: object,
              properties:
                {
                  name: { type: string },
                  items: { type: array, items: { type: object, properties: { name: { type: string } } } },
                },
            }
    AddOnBody:
      type: object
      required: [type, name, price]
      properties:
        type: { type: string, enum: [sound_system, smd] }
        name: { type: string }
        description: '{ type: string }'
        price: { type: string }
    SubmittedVenue:
      type: object
      properties:
        id: { type: string, format: uuid }
        approvalStatus: { type: string }
        submittedAt: { type: string, format: date-time }
    Listing:
      type: object
      description: Everything the owner entered, structured, with file URLs and each photo's check result.
      additionalProperties: true
    OwnerVenue:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        approvalStatus: { type: string }
        rejectionReason: { type: [string, 'null'] }
        changesNote: { type: [string, 'null'] }
        suspensionReason: { type: [string, 'null'] }
        submittedAt: { type: [string, 'null'], format: date-time }
        reviewedAt: { type: [string, 'null'], format: date-time }
        coverUrl: { type: [string, 'null'] }
        photoChecks: { type: object, additionalProperties: { type: integer } }
        revision:
          {
            type: [object, 'null'],
            description: 'Latest edit of the live venue: { id, status, submittedAt, decidedAt, note }.',
          }
    AdminVenueList:
      type: object
      properties:
        rows: { type: array, items: { type: object, additionalProperties: true } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        pageCount: { type: integer }
        counts: { type: object, additionalProperties: { type: integer } }
        cities: { type: array, items: { type: string } }
    AdminVenueReview:
      type: object
      properties:
        listing: { $ref: '#/components/schemas/Listing' }
        venue: { $ref: '#/components/schemas/VenueDetail' }
        history:
          type: array
          items:
            {
              type: object,
              properties:
                { action: { type: string }, details: { type: object }, at: { type: string }, by: { type: string } },
            }
    AdminImageList:
      type: object
      properties:
        images: { type: array, items: { type: object, additionalProperties: true } }
        counts: { type: object, additionalProperties: { type: integer } }
    AdminStats:
      type: object
      additionalProperties: true
    AuditList:
      type: object
      properties:
        rows: { type: array, items: { type: object, additionalProperties: true } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        pageCount: { type: integer }
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - INVALID_JSON
        - BAD_REQUEST
        - EMAIL_TAKEN
        - PHONE_TAKEN
        - INVALID_CREDENTIALS
        - ACCOUNT_LOCKED
        - ACCOUNT_SUSPENDED
        - RESET_CODE_INVALID
        - RESET_CODE_EXPIRED
        - RESET_CODE_LOCKED
        - SESSION_EXPIRED
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - INVALID_STATUS
        - UNSUPPORTED_FILE_TYPE
        - FILE_TOO_LARGE
        - UPLOAD_LIMIT
        - BAD_UPLOAD
        - DETECTOR_UNAVAILABLE
        - NO_PENDING_CHANGES
        - HALL_IN_USE
        - FILE_GONE
        - LAST_MENU
        - TOO_MANY_MENUS
        - TOO_MANY_ADD_ONS
        - ALREADY_REPORTED
        - SLOT_UNAVAILABLE
        - SLOT_TAKEN
        - HOLD_EXPIRED
        - PAST_DATE
        - INVALID_TRANSITION
        - NOT_CONFIRMED
        - EVENT_PASSED
        - GUEST_EXISTS
        - TOO_MANY_GUESTS
        - INVITATION_NOT_FOUND
        - RSVP_CLOSED
        - SELF_ACTION
        - LAST_ADMIN
        - HAS_VENUES
        - HAS_ACTIVE_BOOKINGS
        - NOT_DISPUTABLE
        - DISPUTE_EXISTS
        - DISPUTE_CLOSED
        - OWN_VENUE
        - REPORT_EXISTS
        - PAYLOAD_TOO_LARGE
        - RATE_LIMITED
        - INTERNAL_ERROR
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string, description: User-facing; says how to fix the problem (NFR-3). }
            details:
              { description: 'Depends on the code: a FieldError list, or an object such as { minutesRemaining }.' }
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string, examples: [phone, preferences.guestCount, body] }
        message: { type: string }
    ValidationErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code: { const: VALIDATION_ERROR }
            message: { type: string }
            details:
              type: array
              items: { $ref: '#/components/schemas/FieldError' }

    Role:
      type: string
      enum: [customer, venue_owner, decorator, admin]
    EventType:
      type: string
      enum: [wedding, mehndi, barat, walima, engagement, birthday, corporate, conference, religious, other]
    PkMobileInput:
      type: string
      maxLength: 30
      description: 'Pakistani mobile in any of: `03XX-XXXXXXX`, `03XXXXXXXXX`, `+92 3XX XXXXXXX`, `+923XXXXXXXXX` (spaces and dashes allowed). Stored and returned as `+923XXXXXXXXX`.'
      examples: [0300-1234567, '+92 300 1234567']
    PkMobile:
      type: string
      pattern: '^\+923[0-9]{9}$'
      examples: ['+923001234567']
    Email:
      type: string
      format: email
      maxLength: 254
      description: Trimmed and stored lowercase.
    Password:
      type: string
      minLength: 8
      maxLength: 128
      description: At least one letter and one digit (REQ-1).
      writeOnly: true
    Name: { type: string, minLength: 2, maxLength: 100, description: Trimmed. }
    City: { type: string, minLength: 2, maxLength: 100, description: Trimmed. }
    BusinessName: { type: string, minLength: 2, maxLength: 150 }
    Bio: { type: string, minLength: 1, maxLength: 500, description: Decorator's short description (REQ-1). }
    Money:
      type: string
      pattern: '^\d{1,10}(\.\d{1,2})?$'
      description: PKR as a decimal string. Returned with two decimals.
      examples: ['350000.00']
    Preferences:
      type: object
      additionalProperties: false
      description: REQ-4 personalisation preferences (customers.preferences).
      properties:
        preferredCity: { $ref: '#/components/schemas/City' }
        eventTypes:
          type: array
          maxItems: 10
          uniqueItems: true
          items: { $ref: '#/components/schemas/EventType' }
        guestCount: { type: integer, minimum: 1, maximum: 10000 }
        budgetMax: { $ref: '#/components/schemas/Money' }

    AccountFields:
      type: object
      required: [name, email, phone, password, city]
      properties:
        name: { $ref: '#/components/schemas/Name' }
        email: { $ref: '#/components/schemas/Email' }
        phone: { $ref: '#/components/schemas/PkMobileInput' }
        password: { $ref: '#/components/schemas/Password' }
        city: { $ref: '#/components/schemas/City' }
    RegisterCustomer:
      allOf:
        - $ref: '#/components/schemas/AccountFields'
        - type: object
          required: [role]
          properties:
            role: { const: customer }
            preferences: { $ref: '#/components/schemas/Preferences' }
      unevaluatedProperties: false
    RegisterVenueOwner:
      allOf:
        - $ref: '#/components/schemas/AccountFields'
        - type: object
          required: [role, businessName, contactNumber]
          properties:
            role: { const: venue_owner }
            businessName: { $ref: '#/components/schemas/BusinessName' }
            contactNumber: { $ref: '#/components/schemas/PkMobileInput' }
      unevaluatedProperties: false
    RegisterDecorator:
      allOf:
        - $ref: '#/components/schemas/AccountFields'
        - type: object
          required: [role, businessName, bio]
          properties:
            role: { const: decorator }
            businessName: { $ref: '#/components/schemas/BusinessName' }
            bio: { $ref: '#/components/schemas/Bio' }
            serviceCity:
              allOf: [{ $ref: '#/components/schemas/City' }]
              description: Where the decorator works (decorators.city). Defaults to `city`.
      unevaluatedProperties: false
    RegisterRequest:
      oneOf:
        - $ref: '#/components/schemas/RegisterCustomer'
        - $ref: '#/components/schemas/RegisterVenueOwner'
        - $ref: '#/components/schemas/RegisterDecorator'
      discriminator:
        propertyName: role
        mapping:
          customer: '#/components/schemas/RegisterCustomer'
          venue_owner: '#/components/schemas/RegisterVenueOwner'
          decorator: '#/components/schemas/RegisterDecorator'
    RegisterResponse:
      type: object
      required: [user, next]
      properties:
        user:
          type: object
          required: [id, name, email, role]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            email: { type: string }
            role: { $ref: '#/components/schemas/Role' }
        next: { const: /login, description: EUC-01 step 7 - go to the login page. }

    LoginRequest:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties:
        identifier:
          type: string
          maxLength: 254
          description: Email, or a Pakistani mobile in any accepted format (REQ-2).
        password: { type: string, minLength: 1, maxLength: 128, writeOnly: true }
    EmptyBody:
      type: object
      additionalProperties: false
      maxProperties: 0
    SessionUser:
      type: object
      required: [id, name, email, phone, role, city]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        phone: { $ref: '#/components/schemas/PkMobile' }
        role: { $ref: '#/components/schemas/Role' }
        city: { type: string }
    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/SessionResponse'
        - type: object
          required: [firstLogin]
          properties:
            firstLogin:
              type: boolean
              description: True on the account's first ever login (users.last_login_at was empty before).
    ResetRequested:
      type: object
      required: [message, expiresInMinutes, resendAfterSeconds]
      properties:
        message: { type: string }
        expiresInMinutes: { type: integer, const: 10 }
        resendAfterSeconds: { type: integer, const: 30 }
      example:
        message: If an account uses this email, we sent it a 6-digit code. It expires in 10 minutes.
        expiresInMinutes: 10
        resendAfterSeconds: 30
    ResetCode:
      type: string
      pattern: '^[0-9]{6}$'
      description: The 6-digit code from the email.
    SessionResponse:
      type: object
      required: [accessToken, user, homePath]
      properties:
        accessToken: { type: string, description: JWT. Keep in memory only. }
        user: { $ref: '#/components/schemas/SessionUser' }
        homePath:
          type: string
          enum: [/app, /owner, /decorator, /admin]
          description: customer /app, venue_owner /owner, decorator /decorator, admin /admin (EUC-02 step 6).
      example:
        accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          {
            id: 6f1c2b8e-2f43-4c6e-9a61-0d4a4c2b9e11,
            name: Ayesha Khan,
            email: ayesha@example.pk,
            phone: '+923001234567',
            role: customer,
            city: Faisalabad,
          }
        homePath: /app

    ProfileBase:
      type: object
      required: [id, name, email, phone, role, city, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        phone: { $ref: '#/components/schemas/PkMobile' }
        role: { $ref: '#/components/schemas/Role' }
        city: { type: string }
        createdAt: { type: string, format: date-time }
    Profile:
      oneOf:
        - allOf:
            - $ref: '#/components/schemas/ProfileBase'
            - type: object
              required: [preferences]
              properties:
                role: { const: customer }
                preferences: { $ref: '#/components/schemas/Preferences' }
        - allOf:
            - $ref: '#/components/schemas/ProfileBase'
            - type: object
              required: [businessName, contactNumber]
              properties:
                role: { const: venue_owner }
                businessName: { type: string }
                contactNumber: { $ref: '#/components/schemas/PkMobile' }
        - allOf:
            - $ref: '#/components/schemas/ProfileBase'
            - type: object
              required: [businessName, bio, serviceCity]
              properties:
                role: { const: decorator }
                businessName: { type: string }
                bio: { type: string }
                serviceCity: { type: string }
        - allOf:
            - $ref: '#/components/schemas/ProfileBase'
            - type: object
              properties:
                role: { const: admin }

    UpdateCommon:
      type: object
      properties:
        name: { $ref: '#/components/schemas/Name' }
        phone: { $ref: '#/components/schemas/PkMobileInput' }
        city: { $ref: '#/components/schemas/City' }
    UpdateCustomer:
      allOf:
        - $ref: '#/components/schemas/UpdateCommon'
        - type: object
          properties:
            preferences: { $ref: '#/components/schemas/Preferences' }
      minProperties: 1
      unevaluatedProperties: false
    UpdateVenueOwner:
      allOf:
        - $ref: '#/components/schemas/UpdateCommon'
        - type: object
          properties:
            businessName: { $ref: '#/components/schemas/BusinessName' }
            contactNumber: { $ref: '#/components/schemas/PkMobileInput' }
      minProperties: 1
      unevaluatedProperties: false
    UpdateDecorator:
      allOf:
        - $ref: '#/components/schemas/UpdateCommon'
        - type: object
          properties:
            businessName: { $ref: '#/components/schemas/BusinessName' }
            bio: { $ref: '#/components/schemas/Bio' }
            serviceCity: { $ref: '#/components/schemas/City' }
      minProperties: 1
      unevaluatedProperties: false

    PageMeta:
      type: object
      required: [page, pageSize, total]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    SearchHistoryItem:
      type: object
      required: [id, queryText, filters, resultsCount, searchedAt]
      properties:
        id: { type: string, format: uuid }
        queryText: { type: [string, 'null'] }
        filters: { type: object, description: 'location, eventType, date, guests, budget (search_history.filters)' }
        resultsCount: { type: integer, minimum: 0 }
        searchedAt: { type: string, format: date-time }
    BookingStatus:
      type: string
      enum: [requested, held, confirmed, completed, cancelled]
    BookingSummary:
      type: object
      required: [id, status, source, eventType, guestCount, totalAmount, advanceAmount, createdAt, venue, hall, slot]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/BookingStatus' }
        source: { type: string, enum: [online, offline] }
        eventType: { $ref: '#/components/schemas/EventType' }
        guestCount: { type: integer, minimum: 1 }
        totalAmount: { $ref: '#/components/schemas/Money' }
        advanceAmount: { $ref: '#/components/schemas/Money' }
        createdAt: { type: string, format: date-time }
        venue:
          type: object
          required: [id, name, city]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            city: { type: string }
        hall:
          oneOf:
            - type: 'null'
            - type: object
              required: [id, name]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
          description: null = the whole venue.
        slot:
          type: object
          required: [id, date, startTime, endTime]
          properties:
            id: { type: string, format: uuid }
            date: { type: string, format: date, examples: ['2027-01-15'] }
            startTime: { type: string, examples: ['19:00:00'] }
            endTime: { type: string, examples: ['23:00:00'] }
