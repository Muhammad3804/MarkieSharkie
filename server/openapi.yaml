openapi: 3.1.0
info:
  title: MarkieSharkie API
  version: 0.1.0
  summary: Marquee and event-venue booking platform for Pakistan (FYP, FAST NUCES CFD).
  description: |
    REST API for the MarkieSharkie PWA. Every route here is checked against the Express app by
    `server/tests/openapi.test.js`, so this file and the code can't drift apart (NFR-6).

    **Conventions** (docs/api-and-security.md)
    - JSON in and out, camelCase. Money is a decimal string (`"350000.00"`), never a number. Timestamps are ISO-8601 UTC.
    - Errors always look like `{ "error": { "code": "...", "message": "...", "details": ... } }`. `message` is
      user-facing and says how to fix the problem (NFR-3). For `VALIDATION_ERROR`, `details` is a list of
      `{ field, message }` (a field may appear more than once); `field` is a dotted path such as
      `preferences.guestCount`, or `body` / `query` for errors about the whole object.
    - Pagination: `?page=1&pageSize=20` -> `{ data, page, pageSize, total }` (pageSize max 100).
    - Unknown body or query keys are rejected with 400.

    **Sessions** (REQ-2, NFR-4)
    - `POST /auth/login` returns a short-lived **access token** (JWT HS256, 15 min, `{ sub, role }`) and sets the
      **refresh token** as cookie `ms_refresh` (httpOnly, SameSite=Strict, Path=/api/auth, Secure in production).
    - Keep the access token **in memory only** and send it as `Authorization: Bearer <token>`.
    - When it expires (401 `UNAUTHENTICATED`), call `POST /auth/refresh` (the browser sends the cookie). Every refresh
      **rotates** the cookie. A session ends after 30 minutes without a refresh (REQ-2 inactivity) or 7 days at most.
    - **Allow only one refresh at a time across all tabs** (for example a shared in-flight promise plus the Web Locks
      API). Refresh tokens are single-use: presenting one that was already rotated is treated as theft and ends
      **every** session of that user (srs-alignment #26).
    - Inactivity is measured from the last refresh, so refresh while the user is active, not only after a 401.
    - SameSite=Strict means the API and the PWA must be served from the same site in production
      (e.g. `app.example.pk` + `api.example.pk`, or the API behind a rewrite on the PWA's domain).
  contact:
    name: MarkieSharkie team
servers:
  - url: http://localhost:4000/api
    description: Local development
tags:
  - name: Bookings
    description: Holds, bookings, cancellations and owner decisions (EUC-14, 15, 16, 24; docs/booking-engine.md).
  - name: Disputes
    description: Problems with a booking raised by its customer or venue owner, and listing reports (EUC-35, REQ-48).
  - name: Invitations
    description: Event invitations, guests and replies by personal link (EUC-25, 26, 27).
  - name: Health
  - name: Auth
    description: UC-01 Register, UC-02 Log In, UC-03 Log Out (EUC-01, EUC-02)
  - name: Profile
    description: UC-04 Manage Profile (EUC-03)
  - name: Venues
    description: Public venue search and pages (only approved, active venues).
  - name: Owner
    description: A venue owner's listings, drafts and uploads (ownership checked on every call).
  - name: Admin
    description: Venue moderation, photo review, dashboard and audit log (every action audited).

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness + database check
      description: Runs `SELECT 1` against PostgreSQL.
      responses:
        '200':
          description: API and database are up.
          content:
            application/json:
              schema:
                type: object
                required: [status, db]
                properties:
                  status: { const: ok }
                  db: { const: up }
              example: { status: ok, db: up }
        '503':
          description: The database is unreachable.
          content:
            application/json:
              schema:
                type: object
                required: [status, db]
                properties:
                  status: { const: error }
                  db: { const: down }
              example: { status: error, db: down }

  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register an account (UC-01, EUC-01)
      description: |
        EUC-01 steps 3-7, REQ-1. Creates the `users` row and the matching role row (`customers`, `venue_owners` or
        `decorators`) in one transaction. Email and mobile must both be unused. **Does not log the user in**:
        the response tells the client to go to the login page (EUC-01 step 7).

        Public registration only allows `customer`, `venue_owner` and `decorator`. Admins are created by
        `npm run create-admin` (REQ-1); no API route creates an admin.

        Rate limited: 10 per hour per IP.
      x-srs: [EUC-01, UC-01, REQ-1, REQ-3, NFR-3, NFR-4]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
            examples:
              customer:
                value:
                  role: customer
                  name: Ayesha Khan
                  email: ayesha@example.pk
                  phone: 0300-1234567
                  password: Shadi2025
                  city: Faisalabad
                  preferences: { preferredCity: Faisalabad, eventTypes: [walima], guestCount: 300, budgetMax: '350000' }
              venueOwner:
                value:
                  role: venue_owner
                  name: Hamza Ali
                  email: hamza@royalpalm.pk
                  phone: +92 321 7654321
                  password: Marquee99
                  city: Lahore
                  businessName: Royal Palm Marquee
                  contactNumber: 0321-7654321
              decorator:
                value:
                  role: decorator
                  name: Sana Iqbal
                  email: sana@decor.pk
                  phone: '03451112223'
                  password: Floral2025
                  city: Islamabad
                  businessName: Sana Stage Decor
                  bio: Floral stages and lighting for mehndi and barat.
                  serviceCity: Rawalpindi
      responses:
        '201':
          description: Account created. Send the user to `next` (the login page).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterResponse' }
              example:
                user:
                  {
                    id: 6f1c2b8e-2f43-4c6e-9a61-0d4a4c2b9e11,
                    name: Ayesha Khan,
                    email: ayesha@example.pk,
                    role: customer,
                  }
                next: /login
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: |
            `EMAIL_TAKEN` or `PHONE_TAKEN` (REQ-1). `details` lists every taken field. If both are taken the code is
            `EMAIL_TAKEN`. Also returned when two registrations race (database unique constraint).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                emailTaken:
                  value:
                    error:
                      code: EMAIL_TAKEN
                      message: This email is already registered. Log in or use another email.
                      details:
                        [{ field: email, message: This email is already registered. Log in or use another email. }]
                phoneTaken:
                  value:
                    error:
                      code: PHONE_TAKEN
                      message: This mobile number is already registered. Log in or use another number.
                      details:
                        [
                          {
                            field: phone,
                            message: This mobile number is already registered. Log in or use another number.,
                          },
                        ]
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in with email or mobile (UC-02, EUC-02 steps 1-6)
      description: |
        REQ-2: log in with email **or** Pakistani mobile + password and open the role's home page.

        - Unknown user and wrong password return the **same** 401 (no account probing). Deleted accounts behave like
          unknown ones.
        - 5 wrong passwords in a row lock the account for 15 minutes: the 5th attempt and every attempt during the
          lock (even with the right password) get 423 with `details.minutesRemaining`. A lock that has expired resets
          the counter; a successful login resets it too.
        - A suspended account (EUC-02 4.2) gets 403, but only after the password is verified.

        On success, sets the `ms_refresh` cookie and returns the access token. Rate limited: 20 per 15 min per IP.
      x-srs: [EUC-02, UC-02, REQ-2, REQ-3, SYS-04, NFR-4]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            examples:
              email: { value: { identifier: ayesha@example.pk, password: Shadi2025 } }
              mobile: { value: { identifier: 0300-1234567, password: Shadi2025 } }
      responses:
        '200':
          description: |
            Logged in (EUC-02 steps 5-6). `homePath` is the role's dashboard. `firstLogin` is true when the account had
            never logged in before (`users.last_login_at` was empty); the client shows a welcome message.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetRefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: '`INVALID_CREDENTIALS` (EUC-02 4.1). The user can try again.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                { error: { code: INVALID_CREDENTIALS, message: Email/phone or password is incorrect. Try again. } }
        '403': { $ref: '#/components/responses/AccountSuspended' }
        '423':
          description: '`ACCOUNT_LOCKED` (REQ-2). `details.minutesRemaining` says when to try again.'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          details:
                            type: object
                            required: [minutesRemaining]
                            properties:
                              minutesRemaining: { type: integer, minimum: 1 }
              example:
                error:
                  code: ACCOUNT_LOCKED
                  message: Too many wrong attempts. Your account is locked for 15 more minutes. Try again after that.
                  details: { minutesRemaining: 15 }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Get a new access token (rotates the refresh cookie)
      description: |
        REQ-2 session renewal. Uses only the `ms_refresh` cookie (send no body, or `{}`).

        The presented token is locked, revoked and replaced in one transaction; the new cookie keeps the session's
        original 7-day expiry. Rejected with 401 `SESSION_EXPIRED` (and the cookie cleared) when the cookie is missing,
        unknown, revoked, expired, or unused for more than 30 minutes (REQ-2 inactivity), or the account was deleted.
        A suspended account gets 403 `ACCOUNT_SUSPENDED`.

        **Reuse detection:** a token that was already rotated or logged out ends every session of that user. Clients
        must therefore never run two refreshes at once (see the top of this document). Rate limited: 60 per 15 min.
      x-srs: [REQ-2, REQ-3, NFR-4]
      security:
        - refreshCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmptyBody' }
      responses:
        '200':
          description: New access token and a new `ms_refresh` cookie.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetRefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: '`SESSION_EXPIRED`. The cookie is cleared; send the user to log in again.'
          headers:
            Set-Cookie: { $ref: '#/components/headers/ClearRefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: SESSION_EXPIRED, message: Your session has expired. Log in again. } }
        '403':
          description: '`ACCOUNT_SUSPENDED`. All sessions of the user are revoked and the cookie is cleared.'
          headers:
            Set-Cookie: { $ref: '#/components/headers/ClearRefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Log out (UC-03, EUC-02 step 7)
      description: |
        Revokes the refresh token from the cookie and clears the cookie. Idempotent: no cookie, an unknown token or a
        second logout still return 204.

        **The client must also drop its in-memory access token.** Access tokens are short-lived (15 minutes) and are
        not revoked on the server; after logout the refresh token can no longer renew them.
      x-srs: [EUC-02, UC-03, REQ-2]
      security:
        - refreshCookie: []
        - {}
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmptyBody' }
      responses:
        '204':
          description: Logged out.
          headers:
            Set-Cookie: { $ref: '#/components/headers/ClearRefreshCookie' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Email a 6-digit password reset code (REQ-2)
      description: |
        Sends a 6-digit code (crypto-random, stored only as a keyed hash, 10 minutes, single use, 5 tries) to the
        account's email. A new code replaces every earlier one.

        - The answer is **the same 200** whether or not the email has an account (no account probing). Deleted and
          suspended accounts get the same answer and no email.
        - Another request within 30 seconds returns the same answer without sending a new code.
        - Without SMTP settings: development prints the code in the server console; production can't send.

        Rate limited: 10 per 15 min per IP and 3 per 15 min per email address.
      x-srs: [REQ-2, NFR-4]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { $ref: '#/components/schemas/Email' }
            example: { email: ayesha@example.pk }
      responses:
        '200':
          description: Always the same answer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResetRequested' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/verify-reset-code:
    post:
      tags: [Auth]
      operationId: verifyResetCode
      summary: Check a password reset code before asking for the new password (REQ-2)
      description: |
        Same checks as `/auth/reset-password` but doesn't use the code up. A wrong code counts towards the 5 tries.
        Rate limited: 30 per 15 min per IP.
      x-srs: [REQ-2]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, code]
              properties:
                email: { $ref: '#/components/schemas/Email' }
                code: { $ref: '#/components/schemas/ResetCode' }
            example: { email: ayesha@example.pk, code: '482913' }
      responses:
        '200':
          description: The code is right and still valid.
          content:
            application/json:
              schema:
                type: object
                required: [valid]
                properties:
                  valid: { type: boolean, const: true }
        '400': { $ref: '#/components/responses/ResetCodeRejected' }
        '423': { $ref: '#/components/responses/ResetCodeLocked' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password with the emailed code (REQ-2)
      description: |
        Checks the code, saves the new password (same rules as registration, argon2id), uses the code up, clears the
        login lock and revokes every refresh token of the account (all sessions end; this browser's cookie is cleared).
        Rate limited: 30 per 15 min per IP.
      x-srs: [REQ-2, NFR-4]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, code, newPassword]
              properties:
                email: { $ref: '#/components/schemas/Email' }
                code: { $ref: '#/components/schemas/ResetCode' }
                newPassword: { $ref: '#/components/schemas/Password' }
            example: { email: ayesha@example.pk, code: '482913', newPassword: Shadi2026 }
      responses:
        '200':
          description: Password changed.
          headers:
            Set-Cookie: { $ref: '#/components/headers/ClearRefreshCookie' }
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
        '400': { $ref: '#/components/responses/ResetCodeRejected' }
        '423': { $ref: '#/components/responses/ResetCodeLocked' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /me:
    get:
      tags: [Profile]
      operationId: getMe
      summary: My profile (UC-04, EUC-03 step 2)
      description: |
        The logged-in user's base fields plus their role's part: customer `preferences`; venue owner `businessName`,
        `contactNumber`; decorator `businessName`, `bio`, `serviceCity`; admin nothing extra. Any role.
        The user always comes from the access token; there is no way to read someone else's profile.
      x-srs: [EUC-03, UC-04, REQ-4, REQ-3]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The current profile.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountSuspended' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Profile]
      operationId: updateMe
      summary: Edit my profile (UC-04, EUC-03 steps 3-7)
      description: |
        Customer, venue owner and decorator only (EUC-03 actors; admins get 403, srs-alignment #24).
        Send at least one field. Allowed fields depend on the role; anything else (including `email`, `role`,
        `password`, `isActive`, `id`) is rejected with 400. Same validation rules as registration. Users and role
        rows are updated in one transaction: if any field is invalid, **nothing is saved** (EUC-03 5.1). A customer's
        `preferences` replaces the stored preferences object as a whole. Returns the updated profile (step 7).
      x-srs: [EUC-03, UC-04, REQ-4, REQ-1, NFR-3]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/UpdateCustomer'
                - $ref: '#/components/schemas/UpdateVenueOwner'
                - $ref: '#/components/schemas/UpdateDecorator'
              description: Chosen by the caller's role (from the access token), not by a field in the body.
            examples:
              customer: { value: { city: Lahore, preferences: { eventTypes: [mehndi, walima], guestCount: 450 } } }
              venueOwner: { value: { businessName: Shalimar Gardens, contactNumber: 0333-4445556 } }
              decorator: { value: { bio: Mehndi stages and lighting., serviceCity: Sialkot } }
      responses:
        '200':
          description: Saved. The updated profile.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/Profile' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrSuspended' }
        '409':
          description: '`PHONE_TAKEN`: the new mobile number belongs to another account.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: PHONE_TAKEN
                  message: This mobile number is already registered. Log in or use another number.
                  details:
                    [{ field: phone, message: This mobile number is already registered. Log in or use another number. }]
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }

  /me/searches:
    get:
      tags: [Profile]
      operationId: listMySearches
      summary: My past searches (customer, EUC-03 step 2)
      description: The customer's `search_history`, newest first. Empty until venue search exists (Phase 3).
      x-srs: [EUC-03, UC-04, REQ-4]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of searches.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/SearchHistoryItem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrSuspended' }
        '500': { $ref: '#/components/responses/InternalError' }

  /me/bookings:
    get:
      tags: [Profile]
      operationId: listMyBookings
      summary: My bookings (customer, EUC-03 step 2)
      description: |
        Bookings where the customer is the logged-in user, newest event date first, with venue and hall names.
        Empty until the booking engine exists (Phase 4).
      x-srs: [EUC-03, UC-04, REQ-4, REQ-21]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of bookings.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/BookingSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrSuspended' }
        '500': { $ref: '#/components/responses/InternalError' }

  /venues/landing:
    get:
      tags: [Venues]
      operationId: getLandingSections
      summary: Landing page rows (REQ-12, D6)
      description: |
        Rows built from live data: New on MarkieSharkie (approved in the last 21 days), Featured, 360 Virtual Tour,
        Good Food, Popular in Islamabad / Faisalabad / Lahore. Only approved, active venues.
      x-srs: [REQ-12, REQ-13]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                {
                  type: object,
                  required: [sections],
                  properties: { sections: { type: array, items: { $ref: '#/components/schemas/LandingSection' } } },
                }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /venues:
    get:
      tags: [Venues]
      operationId: searchVenues
      summary: Search approved venues (REQ-12, Explore page)
      description: |
        Every filter is optional. `date` keeps venues with at least one available hall slot that day. A logged-in
        customer's search is saved to their history (REQ-4). Page size 12; a page past the end returns the last page.
      x-srs: [REQ-12, EUC-09]
      parameters:
        - { in: query, name: city, schema: { type: string, maxLength: 80 }, description: 'City, area or name contains' }
        - { in: query, name: location, schema: { type: string }, description: 'Old name for city' }
        - { in: query, name: date, schema: { type: string, format: date } }
        - { in: query, name: guests, schema: { type: integer, minimum: 0 } }
        - { in: query, name: eventType, schema: { $ref: '#/components/schemas/EventType' } }
        - { in: query, name: priceMin, schema: { type: integer }, description: 'Rupees per head' }
        - { in: query, name: priceMax, schema: { type: integer } }
        - { in: query, name: capacity, schema: { type: string, enum: [any, up-to-500, 500-750, 750-plus] } }
        - { in: query, name: rating, schema: { type: string, enum: ['4.6', '4.8', '4.9'] } }
        - {
            in: query,
            name: setting,
            schema: { type: string },
            description: 'Comma list of indoor, outdoor, semi_outdoor',
          }
        - { in: query, name: amenities, schema: { type: string }, description: 'Comma list of facility keys' }
        - { in: query, name: catering, schema: { type: string, enum: ['1'] } }
