<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1160px" height="816px" viewBox="0 0 1160 816" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><g transform="translate(0.5,0.5)" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000"><text x="40.0" y="36.0" text-anchor="start" font-weight="bold" font-size="18">MarkieSharkie - Sequence Diagram: Hold Slot and Book Venue</text>
<text x="40.0" y="56.0" text-anchor="start" font-size="11">Numbers show the order of the steps. Solid arrows are requests, dashed arrows are replies.</text>
