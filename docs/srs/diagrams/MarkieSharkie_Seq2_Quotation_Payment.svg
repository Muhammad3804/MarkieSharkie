<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1160px" height="818px" viewBox="0 0 1160 818" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><g transform="translate(0.5,0.5)" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000"><text x="40.0" y="36.0" text-anchor="start" font-weight="bold" font-size="18">MarkieSharkie - Sequence Diagram: Quotation and Payment Tracking</text>
<text x="40.0" y="56.0" text-anchor="start" font-size="11">Numbers show the order of the steps. Solid arrows are requests, dashed arrows are replies.</text>
<rect x="50" y="410" width="1060" height="220" fill="none" stroke="#000"/>
<polygon points="50,410 91.421875,410 91.421875,422 83.421875,430 50,430" fill="#fff" stroke="#000"/>
<text x="57.0" y="424.0" text-anchor="start" font-weight="bold" font-size="12">loop</text>
<rect x="98.4" y="412.0" width="146.7" height="16" fill="#fff"/>
<text x="101.4" y="424.0" text-anchor="start" font-size="12">[until accepted or rejected]</text>
<line x1="120" y1="100" x2="120" y2="788" stroke="#000" stroke-dasharray="6 5"/>
<line x1="350" y1="100" x2="350" y2="788" stroke="#000" stroke-dasharray="6 5"/>
<line x1="580" y1="100" x2="580" y2="788" stroke="#000" stroke-dasharray="6 5"/>
<line x1="810" y1="100" x2="810" y2="788" stroke="#000" stroke-dasharray="6 5"/>
<line x1="1040" y1="100" x2="1040" y2="788" stroke="#000" stroke-dasharray="6 5"/>
<line x1="120" y1="166" x2="350" y2="166" stroke="#000"/>
<polygon points="350,166 340,161.5 340,170.5" fill="#000"/>
<rect x="179.0" y="148.0" width="112.0" height="16" fill="#fff"/>
<text x="235.0" y="160.0" text-anchor="middle" font-size="12">1. request quotation</text>
<line x1="350" y1="212" x2="580" y2="212" stroke="#000"/>
<polygon points="580,212 570,207.5 570,216.5" fill="#000"/>
<rect x="390.6" y="194.0" width="148.7" height="16" fill="#fff"/>
<text x="465.0" y="206.0" text-anchor="middle" font-size="12">2. create quotation request</text>
<line x1="580" y1="258" x2="810" y2="258" stroke="#000"/>
<polygon points="810,258 800,253.5 800,262.5" fill="#000"/>
<rect x="615.0" y="240.0" width="160.0" height="16" fill="#fff"/>
<text x="695.0" y="252.0" text-anchor="middle" font-size="12">3. save quotation (Proposed)</text>
<line x1="580" y1="304" x2="1040" y2="304" stroke="#000"/>
<polygon points="1040,304 1030,299.5 1030,308.5" fill="#000"/>
<rect x="739.7" y="286.0" width="140.7" height="16" fill="#fff"/>
<text x="810.0" y="298.0" text-anchor="middle" font-size="12">4. notify owner of request</text>
<line x1="1040" y1="350" x2="580" y2="350" stroke="#000"/>
<polygon points="580,350 590,345.5 590,354.5" fill="#000"/>
<rect x="749.0" y="332.0" width="122.0" height="16" fill="#fff"/>
<text x="810.0" y="344.0" text-anchor="middle" font-size="12">5. send quote amount</text>
<line x1="580" y1="396" x2="350" y2="396" stroke="#000" stroke-dasharray="6 4"/>
<polyline points="359,392 350,396 359,400" fill="none" stroke="#000"/>
<rect x="391.7" y="378.0" width="146.7" height="16" fill="#fff"/>
<text x="465.0" y="390.0" text-anchor="middle" font-size="12">6. show quote to customer</text>
<line x1="120" y1="476" x2="350" y2="476" stroke="#000"/>
<polygon points="350,476 340,471.5 340,480.5" fill="#000"/>
<rect x="163.0" y="458.0" width="144.0" height="16" fill="#fff"/>
<text x="235.0" y="470.0" text-anchor="middle" font-size="12">7. accept / counter / reject</text>
<line x1="350" y1="522" x2="580" y2="522" stroke="#000"/>
<polygon points="580,522 570,517.5 570,526.5" fill="#000"/>
<rect x="416.0" y="504.0" width="98.0" height="16" fill="#fff"/>
<text x="465.0" y="516.0" text-anchor="middle" font-size="12">8. send response</text>
<line x1="580" y1="568" x2="810" y2="568" stroke="#000"/>
<polygon points="810,568 800,563.5 800,572.5" fill="#000"/>
<rect x="623.0" y="550.0" width="144.0" height="16" fill="#fff"/>
<text x="695.0" y="562.0" text-anchor="middle" font-size="12">9. update quotation status</text>
<line x1="580" y1="614" x2="1040" y2="614" stroke="#000"/>
<polygon points="1040,614 1030,609.5 1030,618.5" fill="#000"/>
<rect x="731.6" y="596.0" width="156.7" height="16" fill="#fff"/>
<text x="810.0" y="608.0" text-anchor="middle" font-size="12">10. notify owner of response</text>
<line x1="1040" y1="676" x2="580" y2="676" stroke="#000"/>
<polygon points="580,676 590,671.5 590,680.5" fill="#000"/>
<rect x="731.4" y="658.0" width="157.2" height="16" fill="#fff"/>
<text x="810.0" y="670.0" text-anchor="middle" font-size="12">11. record advance payment</text>
<line x1="580" y1="722" x2="810" y2="722" stroke="#000"/>
<polygon points="810,722 800,717.5 800,726.5" fill="#000"/>
<rect x="600.3" y="704.0" width="189.4" height="16" fill="#fff"/>
<text x="695.0" y="716.0" text-anchor="middle" font-size="12">12. save payment, update balance</text>
<line x1="580" y1="768" x2="350" y2="768" stroke="#000" stroke-dasharray="6 4"/>
<polyline points="359,764 350,768 359,772" fill="none" stroke="#000"/>
<rect x="387.3" y="750.0" width="155.4" height="16" fill="#fff"/>
<text x="465.0" y="762.0" text-anchor="middle" font-size="12">13. show remaining balance</text>
<rect x="55.0" y="64" width="130" height="36" fill="#fff" stroke="#000"/>
<text x="120.0" y="87.0" text-anchor="middle" font-weight="bold" font-size="13">Customer</text>
<rect x="285.0" y="64" width="130" height="36" fill="#fff" stroke="#000"/>
<text x="350.0" y="87.0" text-anchor="middle" font-weight="bold" font-size="13">Web App</text>
<rect x="515.0" y="64" width="130" height="36" fill="#fff" stroke="#000"/>
<text x="580.0" y="87.0" text-anchor="middle" font-weight="bold" font-size="13">Server</text>
<rect x="745.0" y="64" width="130" height="36" fill="#fff" stroke="#000"/>
<text x="810.0" y="87.0" text-anchor="middle" font-weight="bold" font-size="13">Database</text>
<rect x="975.0" y="64" width="130" height="36" fill="#fff" stroke="#000"/>
<text x="1040.0" y="87.0" text-anchor="middle" font-weight="bold" font-size="13">Venue Owner</text>
</g></svg>